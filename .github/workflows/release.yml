name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CXXFLAGS='-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Package
        run: |
          mkdir -p dist/renderercheck-${GITHUB_REF_NAME}/bin dist/renderercheck-${GITHUB_REF_NAME}/include/rendercheck
          cp build/renderercheck dist/renderercheck-${GITHUB_REF_NAME}/bin/
          cp include/rendercheck/capture.h include/rendercheck/metrics.h dist/renderercheck-${GITHUB_REF_NAME}/include/rendercheck/
          cp README.md LICENSE dist/renderercheck-${GITHUB_REF_NAME}/
          tar -C dist -czf dist/renderercheck-${GITHUB_REF_NAME}-linux-x86_64.tar.gz renderercheck-${GITHUB_REF_NAME}
          (cd dist && sha256sum renderercheck-${GITHUB_REF_NAME}-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/renderercheck-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
