name: CI

on:
  push:
    branches:
      - ci-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderercheck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          cxxflags='-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror'
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cxxflags+=' -Wno-unused-function'
          fi
          make CXXFLAGS="$cxxflags"

      - name: Run complete Makefile test suite
        run: make test

  sanitizers:
    name: ASan + UBSan
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with sanitizers
        run: |
          make \
            CXXFLAGS='-std=c++20 -O0 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined'

      - name: Run complete suite with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make test

  linux-headless-graphics:
    name: Linux headless graphics
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git xvfb \
            libgl1-mesa-dev mesa-utils xorg-dev libglfw3-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers

      - name: Build and install RendererCheck
        run: |
          make CXXFLAGS='-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror'
          sudo make install
          renderercheck version

      - name: Basic C capture, approval, metrics, and regression detection
        working-directory: examples/basic-c
        run: |
          set -euo pipefail
          make
          rm -rf .rendercheck
          if renderercheck run gradient; then
            echo 'Expected the first run to require a run-performance baseline'
            exit 1
          fi
          test -s .rendercheck/gradient/actual.png
          grep -q '"schema_version": 1' .rendercheck/results.json
          grep -q '"name":"draw_calls"' .rendercheck/results.json
          grep -q 'run-performance baseline missing' .rendercheck/results.json
          renderercheck approve gradient
          renderercheck run gradient
          if RENDERCHECK_EXAMPLE_MUTATE=1 renderercheck run gradient; then
            echo 'RendererCheck unexpectedly accepted a changed committed baseline'
            exit 1
          fi
          test -s .rendercheck/gradient/diff.png

      - name: GLFW OpenGL framebuffer capture under Xvfb/Mesa
        working-directory: examples/glfw-opengl
        run: |
          set -euo pipefail
          make
          rm -rf baselines .rendercheck
          if renderercheck run opengl-frame; then
            echo 'Expected the first OpenGL run to fail without a baseline'
            exit 1
          fi
          test -s .rendercheck/opengl-frame/actual.png
          renderercheck approve opengl-frame
          renderercheck run opengl-frame
          grep -q '"renderer_mode": "software"' .rendercheck/results.json
          grep -q '"headless_backend": "xvfb"' .rendercheck/results.json

      - name: Build raylib
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf /tmp/raylib
            if git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git /tmp/raylib; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
          cmake -S /tmp/raylib -B /tmp/raylib-build -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/raylib-build --parallel 2
          sudo cmake --install /tmp/raylib-build
          sudo ldconfig

      - name: Raylib framebuffer capture under Xvfb/Mesa
        working-directory: examples/raylib
        run: |
          set -euo pipefail
          make
          rm -rf baselines .rendercheck
          if renderercheck run raylib-frame; then
            echo 'Expected the first raylib run to fail without a baseline'
            exit 1
          fi
          test -s .rendercheck/raylib-frame/actual.png
          renderercheck approve raylib-frame
          renderercheck run raylib-frame
          grep -q '"renderer_mode": "software"' .rendercheck/results.json

      - name: Build SDL3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf /tmp/SDL
            if git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
          cmake -S /tmp/SDL -B /tmp/sdl3-build -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build --parallel 2
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig

      - name: SDL3 framebuffer capture under Xvfb/Mesa
        working-directory: examples/sdl3
        run: |
          set -euo pipefail
          make
          rm -rf baselines .rendercheck
          if renderercheck run sdl3-frame; then
            echo 'Expected the first SDL3 run to fail without a baseline'
            exit 1
          fi
          test -s .rendercheck/sdl3-frame/actual.png
          renderercheck approve sdl3-frame
          renderercheck run sdl3-frame
          grep -q '"renderer_mode": "software"' .rendercheck/results.json

      - name: Vulkan validation pass and intentional failure
        working-directory: examples/vulkan-validation
        run: |
          set -euo pipefail
          make
          renderercheck doctor --verbose
          renderercheck run clean
          if RENDERCHECK_VK_INVALID=1 renderercheck run clean; then
            echo 'RendererCheck unexpectedly accepted an intentional Vulkan VUID'
            exit 1
          fi
          grep -q 'VUID-' .rendercheck/clean/validation.log

      - name: Upload RendererCheck artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderercheck-linux-headless
          path: |
            examples/basic-c/.rendercheck/
            examples/glfw-opengl/.rendercheck/
            examples/raylib/.rendercheck/
            examples/sdl3/.rendercheck/
            examples/vulkan-validation/.rendercheck/
          include-hidden-files: true
          if-no-files-found: ignore

  macos-metal:
    name: macOS offscreen Metal
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and install RendererCheck
        shell: bash
        run: |
          set -euo pipefail
          make CXXFLAGS='-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-unused-function'
          sudo make install

      - name: Offscreen Metal capture
        working-directory: examples/metal
        run: |
          set -euo pipefail
          make
          rm -rf baselines .rendercheck
          if renderercheck run metal-frame; then
            echo 'Expected the first Metal run to fail without a baseline'
            exit 1
          fi
          test -s .rendercheck/metal-frame/actual.png
          renderercheck approve metal-frame
          renderercheck run metal-frame

      - name: Upload Metal artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderercheck-metal
          path: examples/metal/.rendercheck/
          include-hidden-files: true
          if-no-files-found: ignore
